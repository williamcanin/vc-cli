[package]
name = "vc-cli"
version = "0.1.2"
edition = "2024"
description = "A small interactive command-line helper for mounting, dismounting, listing, and opening VeraCrypt volumes."

[[bin]]
name = "vc"
path = "src/bin/vc.rs"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
dialoguer = "0.12"
rfd = "0.17.2"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.4"
